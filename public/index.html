<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Numly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <div>
      <h1>NUMLY</h1>
      <p class="meta" id="meta"></p>
    </div>
    <div class="tools">
      <span class="plate" id="streak" data-ta="title:streakTitle"></span>
      <button class="icon" id="helpBtn" data-ta="aria-label:help,title:help"><svg viewBox="0 0 24 24"><path d="M9.2 9a3 3 0 1 1 4.3 2.7c-.9.4-1.5 1.2-1.5 2.2v.6M12 18h.01"/></svg></button>
      <button class="icon" id="statsBtn" data-ta="aria-label:stats,title:stats"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg></button>
      <button class="icon" id="muteBtn" data-ta="aria-label:sound,title:sound"></button>
      <select class="lang" id="lang" data-ta="aria-label:language,title:language"></select>
    </div>
  </header>

  <div class="vault" id="vault">
    <div class="inside" aria-live="polite">
      <div>
        <p class="eyebrow" data-t="opened"></p>
        <p class="loot" id="loot"></p>
        <p id="lootInfo"></p>
        <p class="next"><span data-t="next"></span> <b id="cd">--:--:--</b></p>
        <div class="actions">
          <button class="btn gold" id="share" data-t="share"></button>
          <button class="btn" id="statsBtn2" data-t="stats"></button>
        </div>
      </div>
    </div>
    <form class="door" id="door">
      <div class="top">
        <span class="label" id="label"></span>
        <div class="leds" id="leds" role="img" data-ta="aria-label:leds"></div>
      </div>
      <div class="otp" id="otp"></div>
      <div class="base">
        <span class="hint" data-t="turn"></span>
        <button class="wheel" id="wheel" data-ta="aria-label:wheel"></button>
        <span class="hint">ENTER</span>
      </div>
    </form>
    <div class="stamp" id="stamp"></div>
  </div>
  <p id="msg" role="status"></p>
  <ol class="log" id="log"></ol>

  <section class="pad">
    <div class="padbar">
      <button class="toggle" id="padBtn" aria-pressed="false"><span class="sw"></span><span data-t="pad"></span></button>
      <span class="left" id="left"></span>
    </div>
    <p class="warn" id="padWarn"></p>
    <div id="padBody" hidden>
      <p class="legend" data-t="legend"></p>
      <div class="padgrid" id="pad"></div>
    </div>
  </section>
</main>

<dialog id="help">
  <h2 data-t="howTitle"></h2>
  <ol class="steps" data-t="steps"></ol>
  <div class="example">
    <div><span data-t="exCode"></span><code>40712</code></div>
    <div><span data-t="exTip"></span><code>41111</code></div>
    <div><span data-t="exRes"></span><i class="led on"></i><i class="led on"></i><i class="led"></i><i class="led"></i><i class="led"></i></div>
    <p data-t="exText"></p>
  </div>
  <p class="note" data-t="note"></p>
  <form method="dialog"><button class="btn gold wide" data-t="go"></button></form>
</dialog>

<dialog id="stats">
  <h2 data-t="statsTitle"></h2>
  <div class="tiles">
    <div><b id="sWon">0</b><span data-t="sWon"></span></div>
    <div><b id="sStreak">0</b><span data-t="sStreak"></span></div>
    <div><b id="sBest">0</b><span data-t="sBest"></span></div>
  </div>
  <div class="hist" id="hist"></div>
  <form method="dialog"><button class="btn gold wide" data-t="close"></button></form>
</dialog>
<canvas id="fx"></canvas>

<script type="module" src="js/main.js"></script>
</body>
</html>
